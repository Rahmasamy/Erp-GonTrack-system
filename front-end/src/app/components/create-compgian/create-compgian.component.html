<form [formGroup]="myForm" (ngSubmit)="onSubmit()">
  <label>
    Campaign Name:
    <input formControlName="campagian_name" type="text" />
  </label>

  <label>
    Status:
    <input formControlName="status" type="text" />
  </label>

  <!-- <label>
    Account ID:
    <input formControlName="acount_id" type="number" />
  </label> -->

  <label>
    Campaign Date:
    <input type="date" formControlName="camp_date" />
  </label>

  <button type="submit" [disabled]="myForm.invalid">Submit</button>
</form>
