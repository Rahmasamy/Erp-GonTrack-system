<div class="login-container">
  <div class="login-box">
    <h1>Login</h1>
    <p>Login to access your Tutor hub account</p>
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="input-group">
        <label for="email">Email *</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Email"
        />
        <div
          *ngIf="
            loginForm.get('email')?.invalid && loginForm.get('email')?.touched
          "
        >
          <small *ngIf="loginForm.get('email')?.errors?.['required']"
            >Email is required.</small
          >
          <small *ngIf="loginForm.get('email')?.errors?.['email']"
            >Invalid email format.</small
          >
        </div>
      </div>
      <div class="input-group">
        <label for="password">Password *</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Password"
        />
        <div
          *ngIf="
            loginForm.get('password')?.invalid &&
            loginForm.get('password')?.touched
          "
        >
          <small *ngIf="loginForm.get('password')?.errors?.['required']"
            >Password is required.</small
          >
        </div>
      </div>
      <div class="options">
        <label> <input type="checkbox" /> Remember me </label>
        <a href="#" class="forgot-password">Forgot Password?</a>
      </div>
      <button type="submit" class="login-btn" [disabled]="loginForm.invalid">
        Login <span>→</span>
      </button>
      <p class="signup-text">Don't have an account? <a href="#">Sign up</a></p>
    </form>
    <div class="social-login">
      <p>Or login with</p>
      <div class="social-icons">
        <!-- <a href="#"><img src="facebook-icon.png" alt="Facebook" /></a>
        <a href="#"><img src="google-icon.png" alt="Google" /></a> -->
      </div>
    </div>
  </div>
</div>
